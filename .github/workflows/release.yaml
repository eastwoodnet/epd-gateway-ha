name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    name: Upload Release Asset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create ZIP file
        run: |
          cd "${{ github.workspace }}/custom_components/epd_gateway"
          zip epd_gateway.zip -r ./

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          files: ${{ github.workspace }}/custom_components/epd_gateway/epd_gateway.zip
